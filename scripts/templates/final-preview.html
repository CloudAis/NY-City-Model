</style><header><h1>纽约 · 真实局部研究<br><small>单文件 / 部分精细证据 · 完整现状精细建筑 0</small></h1><small>不是全纽约完整模型<br>原几何与纹理内嵌 · 米制正交检视</small></header><main><aside><select id="sample" aria-label="真实局部样本"></select><p id="scope"></p><p id="date"></p><p id="unknown"></p><button id="reset">复位视角</button><button id="north">俯视</button><p>拖动旋转 · 右键/双指平移 · 滚轮/双指缩放。已知片段之外不补造楼体、背面或室内。局部零基底不是已配准地面。</p><div id="ids"></div><p id="status"></p><p id="credit"></p><div id="error" role="alert" hidden></div><noscript>浏览器禁用JavaScript，无法运行本3D预览；请启用JavaScript或查看随包静态报告。</noscript></aside><section><canvas id="view" aria-label="真实米制局部几何与历史纹理" tabindex="0"></canvas><div id="loading" role="status">准备内嵌真实资源…</div><div id="legend">固定中性光 · 不确定部分保持未知 · 没有外部CDN/字体/模型请求</div></section></main><script id="data" type="application/json">__PREVIEW_DATA__</script><script>
'use strict';

}
function request(){if(!frame&&ready&&!contextLost)frame=requestAnimationFrame(draw);}

 for(const p of samples[active].primitives){for(const [attr,b,size]of [[loc.position,p.position,3],[loc.normal,p.normal,3],[loc.uv,p.uv,2]]){gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.enableVertexAttribArray(attr);gl.vertexAttribPointer(attr,size,gl.FLOAT,false,0,0);}gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,p.index);gl.uniform4fv(loc.color,p.color);gl.uniform1i(loc.textured,p.texture?1:0);if(p.texture){gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,p.texture);gl.uniform1i(loc.image,0);}gl.drawElements(p.mode,p.count,p.indexType,0);draws++;}if(gl.getError()!==gl.NO_ERROR)fail('WebGL绘制错误');}

async function init(){
 if(!gl)throw Error('当前浏览器不支持WebGL2');program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,'#version 300 es\nin vec3 p;in vec3 normal;in vec2 uv;uniform vec4 view;uniform vec2 pan;uniform vec3 centre;out vec2 vuv;out float light;void main(){vec3 v=vec3(p.x,-p.z,p.y)-centre;float x=v.x*cos(view.x)-v.y*sin(view.x);float north=v.x*sin(view.x)+v.y*cos(view.x);float y=north*sin(view.y)+v.z*cos(view.y);float depth=north*cos(view.y)-v.z*sin(view.y);gl_Position=vec4((x+pan.x)/view.z/view.w,(y+pan.y)/view.z,depth/(view.z*8.),1.);vuv=uv;vec3 n=vec3(normal.x,-normal.z,normal.y);light=length(n)<.01?1.:.65+.35*abs(dot(normalize(n),normalize(vec3(-.4,-.6,1.))));}'));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,'#version 300 es\nprecision highp float;in vec2 vuv;in float light;uniform vec4 color;uniform int textured;uniform sampler2D image;out vec4 outColor;void main(){outColor=textured==1?(gl_FrontFacing?texture(image,vuv):vec4(.52,.55,.56,1.)):vec4(color.rgb*light,color.a);}'));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));loc={position:gl.getAttribLocation(program,'p'),normal:gl.getAttribLocation(program,'normal'),uv:gl.getAttribLocation(program,'uv')};for(const key of ['view','pan','centre','color','textured','image'])loc[key]=gl.getUniformLocation(program,key);
 for(let i=0;i<data.samples.length;i++){samples.push(await loadModel(data.samples[i]));$('loading').textContent='实际解码 '+(i+1)+' / '+data.samples.length+' 个内嵌模型';}ready=true;$('sample').replaceChildren(...data.samples.map((s,i)=>new Option(s.name,i)));select(0);$('loading').hidden=true;
}
$('sample').onchange=()=>select($('sample').value);$('reset').onclick=()=>select(active);$('north').onclick=()=>{pitch=Math.PI/2;request();};canvas.oncontextmenu=e=>e.preventDefault();let pinch=null;
canvas.onpointerdown=e=>{canvas.focus();canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,button:e.button});if(pointers.size===2){const p=[...pointers.values()];pinch={d:Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y),x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2};}};
