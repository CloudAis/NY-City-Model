<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纽约真实样区 · 单文件测绘预览</title><style>*{box-sizing:border-box}body{margin:0;background:#102631;color:#d6e9e5;font:14px system-ui,sans-serif}header{height:80px;border-bottom:1px solid #4e6d76;padding:20px 28px;display:flex;align-items:center;justify-content:space-between}h1{font-size:19px;font-weight:500;margin:0}header small{display:block;color:#91acae;font-size:10px;letter-spacing:2px;margin-top:5px}main{display:grid;grid-template-columns:310px 1fr;height:calc(100dvh - 80px)}aside{padding:24px;overflow:auto;background:#f0f3e9;color:#264b54}canvas{width:100%;height:100%;touch-action:none}select,button{font:inherit;padding:10px;border:1px solid #77989a;border-radius:4px;margin:5px 0;background:#e4ece0;color:#305764;min-height:42px}select{width:100%;font-size:11px}p{font-size:12px;line-height:1.9;color:#74908a}a{color:#4d7e78}#details{font-size:12px;line-height:2.1;overflow-wrap:anywhere}#details b{display:block;font-size:17px;margin-top:15px}#message{color:#9b512d}#legend{position:absolute;left:335px;bottom:20px;font-size:10px;color:#7fa5ac;pointer-events:none}@media(max-width:650px){header{height:70px;padding:15px}h1{font-size:15px}main{height:calc(100dvh - 70px);grid-template-columns:1fr;grid-template-rows:220px 1fr}aside{padding:12px 18px}aside p{display:none}#details{font-size:10px;line-height:1.5}#details b{font-size:12px;margin-top:5px}#legend{left:20px;font-size:8px}}</style><header><h1>纽约 · 真实样区<small>SINGLE-FILE / MEASURED FOOTPRINTS</small></h1><span>轮廓预览 · 非全纽约完整版</span></header><main><aside><select id="area" aria-label="选择真实样区"></select><select id="feature" aria-label="选择来源建筑"></select><button id="reset">全景</button><p>所有轮廓来自保存的NYC官方记录。<br>真实高度未用于生成墙体；屋顶、立面和室内没有补全。<br>地表为明确标记的椭球参考，不是实测地形。</p><div id="count"></div><div id="details">选择建筑以查看证据。</div><p><a id="source" target="_blank" rel="noopener">官方字段与来源 ↗</a></p><div id="message" role="alert"></div></aside><canvas id="view" aria-label="真实样区米制三维轮廓"></canvas></main><div id="legend">左键/单指拖动旋转 · 右键拖动平移 · 滚轮缩放 · ENU局部米 · 未生成楼体</div><script id="real-data" type="application/json">__REAL_DATA_JSON__</script><script>
'use strict';const data=JSON.parse(document.getElementById('real-data').textContent),canvas=document.getElementById('view'),gl=canvas.getContext('webgl2',{antialias:true});let index=0,selected=-1,yaw=.1,pitch=1.1,scale=700,pan=[0,0],vertices=[],ranges=[],buffer,program,down=null;
const area=document.getElementById('area'),feature=document.getElementById('feature'),details=document.getElementById('details'),message=document.getElementById('message');document.getElementById('source').href=data.source;area.replaceChildren(...data.areas.map((a,i)=>new Option(a.id,i)));function fail(e){message.textContent=String(e);}
function compile(type,s){const x=gl.createShader(type);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x;}
function draw(){if(!gl)return;const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio,1.5);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.055,.14,.19,1);gl.clear(gl.COLOR_BUFFER_BIT);gl.useProgram(program);gl.uniform4f(gl.getUniformLocation(program,'view'),yaw,pitch,scale,r.width/r.height);gl.uniform2f(gl.getUniformLocation(program,'pan'),pan[0],pan[1]);gl.bindBuffer(gl.ARRAY_BUFFER,buffer);const a=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,0,0);gl.uniform3f(gl.getUniformLocation(program,'color'),.36,.82,.84);gl.drawArrays(gl.LINES,0,vertices.length/3);if(selected>=0){gl.uniform3f(gl.getUniformLocation(program,'color'),1,.82,.5);gl.drawArrays(gl.LINES,ranges[selected][0],ranges[selected][1]);}}
function choose(n){selected=Number(n);const f=data.areas[index].features[selected];details.replaceChildren();if(f){const b=document.createElement('b');b.textContent=f.name||f.bin||f.id;details.append(b);for(const line of [f.id,'位置/轮廓：官方来源，未独立核验','相对高度：'+(f.height_m==null?'未知，未补值':f.height_m.toFixed(2)+' m（来源值换算，未独立核验）'),'屋顶形状 / 立面：未知','观测日期：未知；记录编辑：'+(f.edited_at||'未知').slice(0,10)]){const p=document.createElement('div');p.textContent=line;details.append(p);}}draw();}
function load(){const a=data.areas[index];vertices=[];ranges=[];for(const f of a.features){ranges.push([vertices.length/3,f.lines.length/3]);for(const v of f.lines)vertices.push(v);}gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(vertices),gl.STATIC_DRAW);scale=vertices.reduce((m,v,i)=>i%3===2?m:Math.max(m,Math.abs(v)),150)*1.25;pan=[0,0];feature.replaceChildren(new Option('选择建筑 · '+a.features.length+'条真实轮廓',-1),...a.features.map((f,i)=>new Option(f.name||f.bin||f.id,i)));document.getElementById('count').textContent=a.features.length+'条来源轮廓；独立核验高度0条';choose(-1);}
try{if(!gl)throw Error('需要WebGL2；本页没有以图片冒充3D。');program=gl.createProgram();gl.attachShader(program,compile(gl.VERTEX_SHADER,'#version 300 es\nin vec3 p;uniform vec4 view;uniform vec2 pan;void main(){float x=p.x*cos(view.x)-p.y*sin(view.x);float n=p.x*sin(view.x)+p.y*cos(view.x);float y=n*sin(view.y)+p.z*cos(view.y);gl_Position=vec4((x+pan.x)/view.z/view.w,(y+pan.y)/view.z,0.,1.);}'));gl.attachShader(program,compile(gl.FRAGMENT_SHADER,'#version 300 es\nprecision mediump float;uniform vec3 color;out vec4 outColor;void main(){outColor=vec4(color,1.);}'));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));buffer=gl.createBuffer();load();}catch(e){fail(e);}
area.onchange=()=>{index=Number(area.value);load();};feature.onchange=()=>choose(feature.value);document.getElementById('reset').onclick=()=>{yaw=.1;pitch=1.1;pan=[0,0];load();};canvas.oncontextmenu=e=>e.preventDefault();canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);down=[e.clientX,e.clientY,e.button]};canvas.onpointermove=e=>{if(!down)return;const dx=e.clientX-down[0],dy=e.clientY-down[1];if(down[2]===2){pan[0]+=dx*scale/canvas.clientHeight*2;pan[1]-=dy*scale/canvas.clientHeight*2;}else{yaw+=dx*.006;pitch=Math.max(.3,Math.min(1.56,pitch+dy*.004));}down=[e.clientX,e.clientY,down[2]];draw();};canvas.onpointerup=canvas.onpointercancel=()=>down=null;canvas.onwheel=e=>{e.preventDefault();scale=Math.max(30,Math.min(10000,scale*Math.exp(e.deltaY*.001)));draw();};new ResizeObserver(draw).observe(canvas);Object.defineProperty(window,'__NYC_PREVIEW__',{value:{snapshot:()=>({areas:data.areas.length,features:data.areas[index].features.length,height_applied:false,selected,error:message.textContent,local_units:'metre',camera:{yaw,pitch,scale,pan:[...pan]},source:data.source})}});
</script></html>
