try{if(!gl)throw Error('需要WebGL2；本页没有以图片冒充3D。');program=gl.createProgram();gl.attachShader(program,compile(gl.VERTEX_SHADER,'#version 300 es\nin vec3 p;uniform vec4 view;uniform vec2 pan;void main(){float x=p.x*cos(view.x)-p.y*sin(view.x);float n=p.x*sin(view.x)+p.y*cos(view.x);float y=n*sin(view.y)+p.z*cos(view.y);gl_Position=vec4((x+pan.x)/view.z/view.w,(y+pan.y)/view.z,0.,1.);}'));gl.attachShader(program,compile(gl.FRAGMENT_SHADER,'#version 300 es\nprecision mediump float;uniform vec3 color;out vec4 outColor;void main(){outColor=vec4(color,1.);}'));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));buffer=gl.createBuffer();load();}catch(e){fail(e);}
area.onchange=()=>{index=Number(area.value);load();};feature.onchange=()=>choose(feature.value);document.getElementById('reset').onclick=()=>{yaw=.1;pitch=1.1;pan=[0,0];load();};canvas.oncontextmenu=e=>e.preventDefault();canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);down=[e.clientX,e.clientY,e.button]};canvas.onpointermove=e=>{if(!down)return;const dx=e.clientX-down[0],dy=e.clientY-down[1];if(down[2]===2){pan[0]+=dx*scale/canvas.clientHeight*2;pan[1]-=dy*scale/canvas.clientHeight*2;}else{yaw+=dx*.006;pitch=Math.max(.3,Math.min(1.56,pitch+dy*.004));}down=[e.clientX,e.clientY,down[2]];draw();};canvas.onpointerup=canvas.onpointercancel=()=>down=null;canvas.onwheel=e=>{e.preventDefault();scale=Math.max(30,Math.min(10000,scale*Math.exp(e.deltaY*.001)));draw();};new ResizeObserver(draw).observe(canvas);Object.defineProperty(window,'__NYC_PREVIEW__',{value:{snapshot:()=>({areas:data.areas.length,features:data.areas[index].features.length,height_applied:false,selected,error:message.textContent,local_units:'metre',camera:{yaw,pitch,scale,pan:[...pan]},source:data.source})}});
</script></html>
